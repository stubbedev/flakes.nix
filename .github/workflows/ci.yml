name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
        with:
          xilo-token: ${{ github.event_name != 'pull_request' && secrets.XILO_TOKEN || '' }}
      - run: nix flake check
      - run: nix fmt -- --ci
      - name: Build every package for the cache
        if: github.event_name != 'pull_request'
        run: nix build .#cache --no-link
