name: Update

on:
  schedule:
    - cron: '17 * * * *'
    - cron: '43 3 * * 1'
  workflow_dispatch:
    inputs:
      flake-inputs:
        description: Also update flake.lock inputs
        type: boolean
        default: false

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
        with:
          xilo-token: ${{ secrets.XILO_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Update flake inputs
        if: github.event.schedule == '43 3 * * 1' || inputs.flake-inputs
        run: nix flake update --commit-lock-file

      - name: Update packages
        id: update
        continue-on-error: true
        run: nix run .#update -- -root . > "$RUNNER_TEMP/changes"

      - name: Commit package updates
        run: |
          git add packages
          if ! git diff --cached --quiet; then
            git commit --message 'packages: update' --message "$(cat "$RUNNER_TEMP/changes")"
          fi

      - name: Count new commits
        id: pending
        run: echo "commits=$(git rev-list --count "origin/${GITHUB_REF_NAME}..HEAD")" >> "$GITHUB_OUTPUT"

      - name: Check
        if: steps.pending.outputs.commits != '0'
        run: nix flake check

      - name: Build every package for the cache
        if: steps.pending.outputs.commits != '0'
        run: nix build .#cache --no-link

      - name: Push
        if: steps.pending.outputs.commits != '0'
        run: git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Build and cache the other systems
        if: steps.pending.outputs.commits != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${GITHUB_REF_NAME}"

      - name: Fail if a package could not be updated
        if: steps.update.outcome == 'failure'
        run: exit 1
