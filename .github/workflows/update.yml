name: Update

on:
  schedule:
    - cron: '17 * * * *'
    - cron: '43 3 * * 1'
  workflow_dispatch:
    inputs:
      flake-inputs:
        description: Also update flake.lock inputs
        type: boolean
        default: false

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
        with:
          xilo-token: ${{ secrets.XILO_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Update flake inputs
        if: github.event.schedule == '43 3 * * 1' || inputs.flake-inputs
        run: nix flake update --commit-lock-file

      - name: Update packages
        id: update
        continue-on-error: true
        run: nix run .#update -- -root . > "$RUNNER_TEMP/changes"

      - name: Commit package updates
        run: |
          git add packages
          if ! git diff --cached --quiet; then
            git commit --message 'packages: update' --message "$(cat "$RUNNER_TEMP/changes")"
          fi

      - name: Check
        run: nix flake check

      - name: Push to cache
        uses: ./.github/actions/push-cache

      - name: Push
        run: git push origin HEAD:${{ github.ref_name }}

      - name: Fail if a package could not be updated
        if: steps.update.outcome == 'failure'
        run: exit 1
