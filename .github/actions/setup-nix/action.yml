name: Set up Nix
description: Install Nix with the xilo cache as a substituter; given a token, every path the job builds is pushed to it

inputs:
  xilo-token:
    description: Push token for the xilo cache; empty to only pull
    default: ''

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@v31
    - uses: stubbedev/xilo@v2
      with:
        url: https://xilos.dev
        cache: stubbedev/main
        token: ${{ inputs.xilo-token }}
