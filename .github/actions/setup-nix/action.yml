name: Set up Nix
description: Install Nix with the xilo cache as a substituter; given a token, every path the job builds is pushed to it

inputs:
  xilo-token:
    description: Push token for the xilo cache; empty to only pull
    default: ''

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
    - uses: stubbedev/xilo@e23c96316500d2e4b668f20313ef3c76e103b5d9 # v2.0.2
      with:
        url: https://xilos.dev
        cache: stubbedev/main
        token: ${{ inputs.xilo-token }}
